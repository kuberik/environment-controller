---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: environments.environments.kuberik.com
spec:
  group: environments.kuberik.com
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is the Schema for the environments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Environment
            properties:
              backend:
                description: Backend contains backend-specific configuration
                properties:
                  project:
                    description: Project is the project identifier (backend-specific
                      format, e.g., "owner/repo" for GitHub)
                    type: string
                  secret:
                    description: Secret is the name of the Kubernetes Secret containing
                      the backend authentication token
                    type: string
                  type:
                    description: Type specifies the backend to use (e.g., "github")
                    enum:
                    - github
                    type: string
                required:
                - project
                - type
                type: object
              environment:
                description: |-
                  Environment is the tier this Environment belongs to. Tiers have a fixed
                  order, earliest first: dev, test, staging, prod. Each tier accepts the
                  aliases listed below; aliases of one tier are the same environment for
                  wave grouping, upstream lookup and GitHub matching (the GitHub
                  environment name is kept as written here). An Environment is gated on
                  the nearest earlier tier that has registered sites for the same name.
                enum:
                - dev
                - development
                - test
                - qa
                - staging
                - stage
                - preprod
                - prod
                - production
                type: string
              lockstep:
                description: |-
                  Lockstep, when true, stops the wave-1 leader from selecting a new version
                  until every wave of this environment has baked the currently selected one.
                  The wave-1 leader's value governs; a disagreeing member surfaces a
                  LockstepMismatch condition.
                type: boolean
              name:
                description: Name is the name of the GitHub deployment (the "kuberik"
                  prefix will be automatically added for GitHub backend if not already
                  present)
                type: string
              relationship:
                description: |-
                  Relationship is DEPRECATED and ignored: environment order is fixed
                  (dev, test, staging, prod). It is still accepted so that existing
                  manifests keep applying; the Environment reports a Deprecated condition.
                  It will be removed in a later release.
                properties:
                  environment:
                    description: Environment is the environment name this environment
                      related to.
                    type: string
                  type:
                    description: Type is the relationship type.
                    enum:
                    - After
                    - Parallel
                    - Alongside
                    type: string
                required:
                - environment
                - type
                type: object
              requeueInterval:
                description: |-
                  RequeueInterval specifies how often the controller should reconcile this Environment
                  If not specified, defaults to 1 minute. Must be a valid duration string (e.g., "1m", "30s", "5m").
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              rolloutRef:
                description: RolloutRef is a reference to the Rollout that this Environment
                  manages
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              site:
                description: |-
                  Site identifies where this instance of the environment runs (e.g. a region
                  or cluster name such as "eu-west-1"). Members of the same environment that
                  run in different clusters are told apart by site. When empty, the
                  controller's default site is used (key "site" of the optional
                  kuberik-cluster-info ConfigMap in the controller namespace), and when that
                  is not set either, the site is "default". Only one Environment (across
                  clusters) may own a given deployment name, tier and site; a second one is
                  reported with WaveReady=False, reason DuplicateSite, and posts nothing.
                maxLength: 63
                pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$
                type: string
              wave:
                description: |-
                  Wave is the rollout wave of this site within its environment ("prod wave 1").
                  Waves of one environment roll out in order: wave N starts a version only
                  after every site of wave N-1 baked it. Defaults to 1.
                format: int32
                minimum: 1
                type: integer
            required:
            - backend
            - environment
            - name
            - rolloutRef
            type: object
          status:
            description: status defines the observed state of Environment
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Environment resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentVersion:
                description: CurrentVersion is the current version being deployed
                type: string
              environmentInfos:
                description: |-
                  EnvironmentInfos tracks deployment information for each environment.
                  Each environment has environment URL and relationships (not per version).
                items:
                  description: EnvironmentInfo represents information about an environment's
                    deployment.
                  properties:
                    environment:
                      description: Environment is the canonical tier name (dev, test,
                        staging, prod)
                      type: string
                    environmentUrl:
                      description: EnvironmentURL is the URL of the actual deployed
                        environment (e.g., dashboard URL)
                      type: string
                    history:
                      description: History contains deployment history entries for
                        this environment
                      items:
                        description: DeploymentHistoryEntry represents a single entry
                          in the deployment history.
                        properties:
                          bakeEndTime:
                            description: |-
                              BakeEndTime is the time when the bake period ended for this deployment
                              This is when the bake process completed (either successfully or with failure).
                            format: date-time
                            type: string
                          bakeStartTime:
                            description: |-
                              BakeStartTime is the time when the bake period started for this deployment
                              This is when the rollout controller began monitoring the deployment for stability.
                            format: date-time
                            type: string
                          bakeStatus:
                            description: |-
                              BakeStatus tracks the bake state for this deployment (e.g., None, InProgress, Succeeded, Failed, Cancelled)
                              The bake process ensures that the deployment is stable and healthy before marking as successful.
                            type: string
                          bakeStatusMessage:
                            description: |-
                              BakeStatusMessage provides details about the bake state for this deployment
                              This field contains human-readable information about why the bake status is what it is.
                            type: string
                          failedHealthChecks:
                            description: |-
                              FailedHealthChecks contains all health checks that failed during bake.
                              This field is populated when bake fails due to health check errors.
                            items:
                              description: FailedHealthCheck represents a health check
                                that failed during bake.
                              properties:
                                message:
                                  description: Message is the error message from the
                                    health check.
                                  type: string
                                name:
                                  description: Name is the name of the health check.
                                  type: string
                                namespace:
                                  description: Namespace is the namespace of the health
                                    check.
                                  type: string
                                observations:
                                  description: |-
                                    Observations is a snapshot of the health check's status.observations taken
                                    when the failure was recorded. It is not updated afterwards, so the figure
                                    survives the health check recovering.
                                  items:
                                    description: |-
                                      HealthCheckObservation is one typed fact a health check evaluated.
                                      Numeric fields are decimal strings (e.g. "8.2", "0.082") so no precision is lost
                                      and the CRD stays float-free.
                                    properties:
                                      direction:
                                        description: 'Direction, for Threshold: Above
                                          is bad when value > limit; Below is bad
                                          when value < limit.'
                                        enum:
                                        - Above
                                        - Below
                                        type: string
                                      healthy:
                                        description: |-
                                          Healthy says whether this observation alone is within bounds, so a consumer
                                          can mark the offending one when several are listed.
                                        type: boolean
                                      kind:
                                        description: |-
                                          Kind picks the drawing: Threshold (value vs limit), Ratio (value of total),
                                          Count (value), State (no number; label only).
                                        enum:
                                        - Threshold
                                        - Ratio
                                        - Count
                                        - State
                                        type: string
                                      limit:
                                        description: Limit is the boundary for a Threshold
                                          observation, as a decimal string.
                                        pattern: ^-?[0-9]+(\.[0-9]+)?$
                                        type: string
                                      name:
                                        description: Name of the observed quantity,
                                          shown as the label ("error rate", "p99 latency").
                                        minLength: 1
                                        type: string
                                      observedTime:
                                        description: ObservedTime is when the provider
                                          last evaluated this observation.
                                        format: date-time
                                        type: string
                                      total:
                                        description: Total is the denominator for
                                          a Ratio observation, as a decimal string.
                                        pattern: ^-?[0-9]+(\.[0-9]+)?$
                                        type: string
                                      unit:
                                        description: 'Unit of the numbers: Percent
                                          (a ratio 0..1), Milliseconds, Seconds, Count,
                                          or free text.'
                                        type: string
                                      value:
                                        description: Value is the observed number,
                                          as a decimal string.
                                        pattern: ^-?[0-9]+(\.[0-9]+)?$
                                        type: string
                                      window:
                                        description: Window the observation covers,
                                          e.g. "5m".
                                        type: string
                                    required:
                                    - kind
                                    - name
                                    type: object
                                  maxItems: 16
                                  type: array
                              required:
                              - name
                              - namespace
                              type: object
                            type: array
                          id:
                            description: ID is a unique auto-incrementing identifier
                              for this history entry.
                            format: int64
                            type: integer
                          lastRetryTimestamp:
                            description: |-
                              LastRetryTimestamp is the time when a retry was most recently requested for this deployment.
                              When set, downstream controllers (health checks, kruise rollout step gates) use this as a
                              cutoff: stale failure conditions with LastTransitionTime older than LastRetryTimestamp are
                              ignored as they reflect the pre-retry state.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              Message provides a descriptive message about this deployment entry
                              This field contains human-readable information about the deployment context.
                              For automatic deployments, it includes information about gate bypass and failed bake unblock.
                              For manual deployments (when wantedVersion is specified), it can contain a custom message
                              provided via the "rollout.kuberik.com/deployment-message" annotation, or defaults to "Manual deployment".
                            type: string
                          timestamp:
                            description: Timestamp is the time when the deployment
                              occurred.
                            format: date-time
                            type: string
                          triggeredBy:
                            description: |-
                              TriggeredBy indicates what triggered this deployment.
                              Kind can be "User" for manual deployments triggered by a user, or "System" for automatic deployments.
                              Name contains the name of the user or system that triggered the deployment.
                              For user-triggered deployments, this is extracted from the "rollout.kuberik.com/deploy-user" annotation.
                              For system-triggered deployments, this is typically "rollout-controller".
                            properties:
                              kind:
                                description: |-
                                  Kind indicates the type of trigger: "User" for manual deployments triggered by a user,
                                  or "System" for automatic deployments triggered by the rollout controller.
                                enum:
                                - User
                                - System
                                type: string
                              name:
                                description: |-
                                  Name contains the name of the user or system that triggered the deployment.
                                  For user-triggered deployments, this is extracted from the "rollout.kuberik.com/deploy-user" annotation.
                                  For system-triggered deployments, this is typically "rollout-controller".
                                type: string
                            required:
                            - kind
                            - name
                            type: object
                          version:
                            description: Version is the version information that was
                              deployed.
                            properties:
                              created:
                                description: Created is the creation timestamp extracted
                                  from OCI annotations if available.
                                format: date-time
                                type: string
                              digest:
                                description: Digest is the image digest if available
                                  from the ImagePolicy.
                                type: string
                              metadataUnresolved:
                                description: |-
                                  MetadataUnresolved is true when this release's OCI manifest could not be
                                  read, so Requires and the version fields say nothing about the image.
                                  A RolloutDependency blocks such a release rather than reading the absent
                                  annotations as "declares no requirement", which would open the gate
                                  whenever the registry is unreachable.
                                type: boolean
                              requires:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Requires maps a contract name to what this release requires of that
                                  contract, extracted from "com.kuberik.rollout.requires.<contract>" OCI
                                  annotations. Values are version constraints as defined by
                                  github.com/Masterminds/semver, applied verbatim — note that a bare version
                                  is an exact match there, not a floor.
                                  RolloutDependency uses these to gate this release on the deployed version of
                                  the Rollout providing each contract.

                                  Bounded because it is populated from image annotations, which are outside
                                  this controller's trust boundary, and is stored on every release and every
                                  history entry.
                                maxProperties: 32
                                type: object
                              revision:
                                description: Revision is the revision information
                                  extracted from OCI annotations if available.
                                type: string
                              tag:
                                description: Tag is the image tag (e.g., "v1.2.3",
                                  "latest").
                                type: string
                              version:
                                description: Version is the semantic version extracted
                                  from OCI annotations if available.
                                type: string
                            required:
                            - tag
                            type: object
                        required:
                        - timestamp
                        - version
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - environment
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              lastStatusChangeTime:
                description: LastStatusChangeTime is the last time the status was
                  updated (only updated when status changes)
                format: date-time
                type: string
              rolloutGateRef:
                description: RolloutGateRef is a reference to the RolloutGate that
                  was created/updated
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              wave:
                description: Wave is set for Environments with a site and describes
                  their wave state.
                properties:
                  blocker:
                    description: Blocker explains why the site is not Ready; nil when
                      WaveReady is True.
                    properties:
                      environment:
                        description: Environment is the canonical tier of the member
                          waited on or at fault.
                        type: string
                      missingWaves:
                        description: MissingWaves are the waves absent from the sequence
                          (InvalidTopology, wave gap).
                        items:
                          format: int32
                          type: integer
                        type: array
                        x-kubernetes-list-type: atomic
                      names:
                        description: |-
                          Names are the alias names registered for one tier (InvalidTopology), the
                          offending name (UnknownTier), or, for DuplicateSite, names[0] is the
                          deployment name the existing owner holds the site for.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      outcome:
                        description: Outcome is set when a leader's bake ended badly.
                        enum:
                        - Failed
                        - Cancelled
                        type: string
                      owner:
                        description: Owner is the existing owner of the site (DuplicateSite).
                        properties:
                          cluster:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - cluster
                        - name
                        - namespace
                        type: object
                      pinnedVersion:
                        description: PinnedVersion is the version the Rollout pins
                          (Pinned).
                        type: string
                      reason:
                        description: Reason is the WaveReady reason.
                        type: string
                      revision:
                        description: Revision is the full revision concerned.
                        type: string
                      selectedVersion:
                        description: SelectedVersion is the tag of the wave's pick
                          (Pinned).
                        type: string
                      site:
                        description: Site is the member waited on.
                        type: string
                      waitingOn:
                        description: WaitingOn is what the wave waits for.
                        enum:
                        - Selection
                        - Bake
                        - Candidate
                        - Sites
                        type: string
                      waves:
                        description: Waves are the waves present (InvalidTopology,
                          wave gap).
                        items:
                          format: int32
                          type: integer
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
                    - reason
                    type: object
                  environment:
                    description: |-
                      Environment is the environment name this site was registered under in
                      GitHub. Deregistration uses it even after spec.environment changed.
                    type: string
                  leader:
                    description: Leader is the site leading this (environment, wave).
                    type: string
                  members:
                    description: Members are the registered sites of this environment
                      and of its upstream environment.
                    items:
                      description: WaveMemberStatus is one site of a wave as observed
                        in the backend.
                      properties:
                        bakeStatus:
                          description: BakeStatus of the member's newest deployment.
                          type: string
                        deregistered:
                          description: Deregistered is true when the member was removed
                            and no longer counts.
                          type: boolean
                        environment:
                          description: Environment of the member.
                          type: string
                        revision:
                          description: Revision of the member's newest deployment.
                          type: string
                        site:
                          description: Site of the member.
                          type: string
                        wave:
                          description: Wave of the member.
                          format: int32
                          type: integer
                      required:
                      - environment
                      - site
                      - wave
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  name:
                    description: |-
                      Name is the deployment name as written to GitHub (with the kuberik prefix).
                      Deregistration uses it even after spec.name changed.
                    type: string
                  role:
                    description: |-
                      Role is Leader or Follower within (environment, wave). It is also the role
                      recorded on the next GitHub deployment this site creates.
                    type: string
                  selectedRevision:
                    description: SelectedRevision is the revision the leader of this
                      wave currently selected.
                    type: string
                  site:
                    description: Site is the effective site of this Environment (spec
                      or controller default).
                    type: string
                  wave:
                    description: Wave is the effective wave of this Environment.
                    format: int32
                    type: integer
                required:
                - site
                - wave
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
