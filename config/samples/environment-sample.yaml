apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: environment-sample
  namespace: default
spec:
  # Reference to the Rollout that this Deployment manages
  rolloutRef:
    name: myapp-rollout

  # Deployment configuration
  name: "kuberik-myapp-production"
  environment: "prod"
  ref: "main"

  # Site and wave of this instance (both optional: the site defaults to the
  # controller's default site, then "default"; the wave defaults to 1)
  site: "eu-west-1"
  wave: 1

  # Backend-specific configuration
  backend:
    type: "github"
    project: "myorg/myapp"
    secret: "github-token"
