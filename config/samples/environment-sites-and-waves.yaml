# Standalone example, not part of config/samples/kustomization.yaml.
# One application ("prod") deployed to three clusters. Each Environment below
# goes to its OWN cluster (apply each document only there); they are shown
# together for reading. Sites are told
# apart in GitHub by payload metadata, the GitHub environment name is the same.
# Each (name, environment, site) may be owned by only one Environment across
# all clusters; a second one reports WaveReady=False / DuplicateSite.
# Environment order is fixed (dev < test < staging < prod): prod is gated on the
# last wave of staging when staging exists in GitHub for the same name.
#
# Wave 1: eu-west-1 and us-east-1 (the lexicographically lowest, eu-west-1, leads).
# Wave 2: ap-south-1 starts a version only after BOTH wave-1 sites baked it.
apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: myapp-prod-eu-west-1
  namespace: default
spec:
  rolloutRef:
    name: myapp-rollout
  name: myapp
  environment: prod
  site: eu-west-1
  wave: 1
  backend:
    type: github
    project: myorg/myapp
    secret: github-token
---
apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: myapp-prod-us-east-1
  namespace: default
spec:
  rolloutRef:
    name: myapp-rollout
  name: myapp
  environment: prod
  site: us-east-1
  wave: 1
  backend:
    type: github
    project: myorg/myapp
    secret: github-token
---
apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: myapp-prod-ap-south-1
  namespace: default
spec:
  rolloutRef:
    name: myapp-rollout
  name: myapp
  environment: prod
  site: ap-south-1
  wave: 2
  backend:
    type: github
    project: myorg/myapp
    secret: github-token
