apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: vendir/crds
    contents:
      - path: rollout-controller
        git:
          url: https://github.com/kuberik/rollout-controller
          ref: d4e4d4abe3900fd13aa9fa71e1ad78967003e8f4
        includePaths:
          - config/crd/bases/*
        newRootPath: config/crd/bases
      - path: release-controller
        git:
          url: https://github.com/kuberik/release-controller
          ref: 77a5ffec0a9983370e59c94c6434e9339e949d53
        includePaths:
          - config/crd/bases/*
        newRootPath: config/crd/bases
      - path: gateway-api
        git:
          url: https://github.com/kubernetes-sigs/gateway-api
          ref: v1.4.1
        includePaths:
          - config/crd/standard/*
        newRootPath: config/crd/standard
